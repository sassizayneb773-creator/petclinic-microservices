stages:
  - build
  - test
  - quality
  - package
  - deploy_staging
  - performance
  - security
  - canary
  - deploy_prod

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  PROJECT_VERSION: "4.0.1"

cache:
  paths:
    - .m2/repository
  key: "$CI_JOB_NAME"

# =============================================================================
# CI STAGES (Continuous Integration)
# =============================================================================

# Stage 1: BUILD - compile & package all 8 microservices into JARs
build_job:
  stage: build
  image: eclipse-temurin:17-jdk-alpine
  before_script:
    - chmod +x mvnw
  script:
    - ./mvnw install -DskipTests
      -Dhttps.protocols=TLSv1.2
      -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
      -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
      -Dorg.slf4j.simpleLogger.showDateTime=true
      -Djava.awt.headless=true
      --batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true
  artifacts:
    paths:
      - "*/target/*.jar"
    expire_in: 1 hour

# Stage 2: TEST - run unit tests
test_job:
  stage: test
  image: eclipse-temurin:17-jdk-alpine
  before_script:
    - chmod +x mvnw
  script:
    - ./mvnw test
      -Dhttps.protocols=TLSv1.2
      -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
      -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
      -Dorg.slf4j.simpleLogger.showDateTime=true
      -Djava.awt.headless=true
      --batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true
  artifacts:
    when: always
    reports:
      junit: "*/target/surefire-reports/TEST-*.xml"

# Stage 3: QUALITY - CodeClimate static analysis
code_quality_job:
  stage: quality
  allow_failure: true
  image: docker:stable
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - mkdir codequality-results
    - docker run
      --env CODECLIMATE_CODE="$PWD"
      --volume "$PWD":/code
      --volume /var/run/docker.sock:/var/run/docker.sock
      --volume /tmp/cc:/tmp/cc
      codeclimate/codeclimate analyze -f html > ./codequality-results/index.html
  artifacts:
    paths:
      - codequality-results/

# Stage 4: PACKAGE - build & push 8 Docker images in parallel
package_job:
  stage: package
  image: docker:stable
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  parallel:
    matrix:
      - SERVICE: spring-petclinic-config-server
        PORT: "8888"
      - SERVICE: spring-petclinic-discovery-server
        PORT: "8761"
      - SERVICE: spring-petclinic-customers-service
        PORT: "8081"
      - SERVICE: spring-petclinic-visits-service
        PORT: "8082"
      - SERVICE: spring-petclinic-vets-service
        PORT: "8083"
      - SERVICE: spring-petclinic-genai-service
        PORT: "8084"
      - SERVICE: spring-petclinic-api-gateway
        PORT: "8080"
      - SERVICE: spring-petclinic-admin-server
        PORT: "9090"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build
      --build-arg ARTIFACT_NAME=target/${SERVICE}-${PROJECT_VERSION}
      --build-arg EXPOSED_PORT=${PORT}
      -t $CI_REGISTRY_IMAGE/${SERVICE}:latest
      -t $CI_REGISTRY_IMAGE/${SERVICE}:${PROJECT_VERSION}
      -f docker/Dockerfile
      ${SERVICE}/
    - docker push $CI_REGISTRY_IMAGE/${SERVICE}:latest
    - docker push $CI_REGISTRY_IMAGE/${SERVICE}:${PROJECT_VERSION}

# =============================================================================
# CD STAGES (Continuous Delivery)
# Target: GitHub Codespaces (Play-with-Docker is deprecated since March 2026)
# =============================================================================

# Stage 5: DEPLOY_STAGING - verify images can be pulled (simulates a staging deploy)
# Real deploy happens in Codespace via: docker login + docker compose up
deploy_staging_job:
  stage: deploy_staging
  image: docker:stable
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Staging deployment target is GitHub Codespaces"
    - echo "Verifying all 8 microservice images are accessible..."
    - docker pull $CI_REGISTRY_IMAGE/spring-petclinic-config-server:latest
    - docker pull $CI_REGISTRY_IMAGE/spring-petclinic-discovery-server:latest
    - docker pull $CI_REGISTRY_IMAGE/spring-petclinic-customers-service:latest
    - docker pull $CI_REGISTRY_IMAGE/spring-petclinic-visits-service:latest
    - docker pull $CI_REGISTRY_IMAGE/spring-petclinic-vets-service:latest
    - docker pull $CI_REGISTRY_IMAGE/spring-petclinic-genai-service:latest
    - docker pull $CI_REGISTRY_IMAGE/spring-petclinic-api-gateway:latest
    - docker pull $CI_REGISTRY_IMAGE/spring-petclinic-admin-server:latest
    - echo "All 8 images verified - ready for Codespace deploy"
  environment:
    name: staging
    url: "https://github.com/codespaces/new?repo=sassizayneb773-creator/petclinic-microservices"

# Stage 6: PERFORMANCE - load test (placeholder; real test needs live URL)
performance_job:
  stage: performance
  image: alpine
  allow_failure: true
  script:
    - echo "Job de performance - lance des tests de charge avec sitespeed.io pour mesurer les temps de reponse de l'application"
    - echo "On affiche un echo car nous n'utilisons plus Play with Docker (deprecie depuis mars 2026)"

# Stage 7: SECURITY - scan all 8 Docker images with Trivy for CVEs
container_scanning:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  services:
    - docker:dind
  variables:
    GIT_STRATEGY: none
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  parallel:
    matrix:
      - SERVICE: spring-petclinic-config-server
      - SERVICE: spring-petclinic-discovery-server
      - SERVICE: spring-petclinic-customers-service
      - SERVICE: spring-petclinic-visits-service
      - SERVICE: spring-petclinic-vets-service
      - SERVICE: spring-petclinic-genai-service
      - SERVICE: spring-petclinic-api-gateway
      - SERVICE: spring-petclinic-admin-server
  cache:
    paths:
      - .trivycache/
  script:
    - trivy --version
    - trivy image --exit-code 0 --cache-dir .trivycache/ --no-progress
      --format json
      --output gl-container-scanning-report-${SERVICE}.json
      $CI_REGISTRY_IMAGE/${SERVICE}:latest
    - trivy image --exit-code 0 --cache-dir .trivycache/ --no-progress
      $CI_REGISTRY_IMAGE/${SERVICE}:latest
    - trivy image --exit-code 0 --cache-dir .trivycache/ --severity CRITICAL --no-progress
      $CI_REGISTRY_IMAGE/${SERVICE}:latest
  artifacts:
    when: always
    paths:
      - gl-container-scanning-report-*.json

# Stage 8: CANARY - manual deploy to a small subset of users (Canary Release pattern)
canary_job:
  stage: canary
  image: alpine
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - echo "Job canary - deploie la nouvelle version a une petite partie des utilisateurs avant le deploiement complet"
    - echo "On affiche un echo car nous n'utilisons plus Play with Docker (deprecie depuis mars 2026)"
  environment:
    name: canary

# Stage 9: DEPLOY_PROD - manual production deploy (final gate)
deploy_prod_job:
  stage: deploy_prod
  image: alpine
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - echo "Job de deploiement en production - mise en ligne finale de l'application pour les vrais utilisateurs"
    - echo "On affiche un echo car nous n'utilisons plus Play with Docker (deprecie depuis mars 2026)"
  environment:
    name: production
    url: "https://github.com/codespaces/new?repo=sassizayneb773-creator/petclinic-microservices"
